<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #fff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e6e6e6;
      --hover: #f3f3f3; --accent: #e5322d; --bar: #ddd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #232327; --fg: #ececec; --muted: #9a9aa0; --line: #38383d;
        --hover: #2f2f34; --accent: #ff4e45; --bar: #44444a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 360px; background: var(--bg); color: var(--fg);
      font: 13px/1.35 system-ui, -apple-system, sans-serif;
    }
    header { padding: 10px; border-bottom: 1px solid var(--line); }
    .actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .actions button {
      padding: 8px; border: 0; border-radius: 6px;
      background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    .actions.options-open #options-toggle { grid-column: 1 / -1; }
    .search { position: relative; min-width: 0; }
    #search { width: 100%; height: 100%; min-width: 0; padding: 8px 28px 8px 9px;
      border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
    #search::placeholder { color: var(--muted); }
    #clear-search { position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
      padding: 2px 5px; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; }
    #clear-search:hover { color: var(--fg); background: var(--hover); }
    #restore-bookmark { background: #247a43; }
    #options-toggle { background: var(--hover); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
    button:disabled { opacity: .6; cursor: wait; }
    [hidden] { display: none !important; }
    #options-panel { padding: 14px 10px; }
    .setting { display: block; margin-bottom: 20px; }
    .setting:last-child { margin-bottom: 0; }
    .setting-title { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
    .setting p { margin: 5px 0 8px; color: var(--muted); font-size: 12px; }
    input[type="range"] { width: 100%; margin: 8px 0 0; accent-color: var(--accent); }
    input[type="checkbox"] { accent-color: #247a43; }
    output { white-space: nowrap; font-variant-numeric: tabular-nums; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
    #status { margin-top: 6px; color: var(--fg); min-height: 1em; font-size: 12px; }
    #hint { color: var(--muted); font-size: 11px; white-space: pre-line; }
    .main:focus { outline: none; }
    li:has(.main:focus) { background: var(--hover); box-shadow: inset 3px 0 0 var(--accent); }
    ul { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
    li { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    li:hover { background: var(--hover); }
    .main { flex: 1; min-width: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .details { flex: 1; min-width: 0; }
    .thumbnail { flex: 0 0 64px; width: 64px; height: 36px; overflow: hidden; border-radius: 3px; background: var(--bar); }
    .thumbnail img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .bar { height: 3px; background: var(--bar); border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); }
    .del {
      border: 0; background: none; color: var(--muted); cursor: pointer;
      font-size: 16px; padding: 2px 6px; border-radius: 4px;
    }
    .del:hover { color: var(--accent); background: var(--line); }
    .empty { padding: 16px 10px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="actions">
      <div id="search-control" class="search">
        <input id="search" type="text" placeholder="Search titles…" aria-label="Search video titles" aria-controls="list" autocomplete="off" spellcheck="false" disabled>
        <button id="clear-search" type="button" aria-label="Clear search" title="Clear search" hidden>×</button>
      </div>
      <button id="restore-bookmark" type="button" hidden>Add bookmark</button>
      <button id="options-toggle" aria-expanded="false" aria-controls="options-panel" disabled>Show options</button>
    </div>
    <div id="status" role="status"></div>
    <div id="hint"></div>
  </header>
  <ul id="list"></ul>
  <section id="options-panel" aria-label="Options" hidden>
    <label class="setting">
      <span class="setting-title"><span>Show thumbnails (t)</span><input id="show-thumbnails" type="checkbox" aria-describedby="thumbnail-help"></span>
      <p id="thumbnail-help">On by default. Loads images from YouTube’s image server using the video IDs. Your bookmarks stay local. Press t outside search to toggle.</p>
    </label>
    <label class="setting">
      <span class="setting-title"><span>Auto-bookmark</span><input id="auto-bookmark" type="checkbox"></span>
      <p>Bookmark an unsaved video when you open this popup. Applies next time you open it.</p>
    </label>
    <label class="setting" for="scrub-seconds">
      <span class="setting-title"><span>Arrow-key scrub</span><output id="scrub-value" for="scrub-seconds"></output></span>
      <p>Seconds to move with ← or → on a bookmark.</p>
      <input id="scrub-seconds" type="range" min="1" max="60" step="1" value="10">
    </label>
    <label class="setting" for="shift-multiplier">
      <span class="setting-title"><span>Shift multiplier</span><output id="multiplier-value" for="shift-multiplier"></output></span>
      <p id="shift-preview"></p>
      <input id="shift-multiplier" type="range" min="1" max="10" step="1" value="3">
    </label>
    <p id="shortcut-help"></p>
  </section>
  <script src="platform.js"></script>
  <script src="player.js"></script>
  <script src="popup.js"></script>
</body>
</html>
